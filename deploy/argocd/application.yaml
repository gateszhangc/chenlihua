apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chenlihua
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gateszhangc/chenlihua.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: chenlihua
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
