apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chenlihua

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: chenlihua
      app.kubernetes.io/part-of: chenlihua
    includeSelectors: true
    includeTemplates: true
