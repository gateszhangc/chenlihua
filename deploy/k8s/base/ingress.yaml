apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chenlihua
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
    cert-manager.io/issuer: letsencrypt-dns-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chenlihua.lol
        - www.chenlihua.lol
      secretName: chenlihua-live-tls
  rules:
    - host: chenlihua.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chenlihua
                port:
                  name: http
    - host: www.chenlihua.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chenlihua
                port:
                  name: http
