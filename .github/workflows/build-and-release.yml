name: Build And Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chenlihua-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.144.91.77.245.sslip.io
  IMAGE_NAME: chenlihua
  IMAGE_REPOSITORY: registry.144.91.77.245.sslip.io/chenlihua
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://chenlihua.lol' }}
  NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID || 'waexonttkx' }}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ env.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ env.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            GOOGLE_SITE_VERIFICATION=${{ env.GOOGLE_SITE_VERIFICATION }}

      - name: Update production image tag
        run: sed -i "s#newTag: .*#newTag: ${GITHUB_SHA}#" deploy/k8s/overlays/prod/kustomization.yaml

      - name: Commit release manifest
        run: |
          if git diff --quiet -- deploy/k8s/overlays/prod/kustomization.yaml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/prod/kustomization.yaml
          git commit -m "chore: release ${GITHUB_SHA::7} [skip ci]"
          git push
